<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #12002f, #4b0082, #ff1493);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Background glow */
    body::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      background: #ff69b4;
      filter: blur(120px);
      opacity: 0.5;
      top: -80px;
      left: -80px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      background: #00ffff;
      filter: blur(120px);
      opacity: 0.35;
      bottom: -100px;
      right: -80px;
    }

    .container {
      width: 92%;
      max-width: 700px;
      text-align: center;
      padding: 40px 25px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      z-index: 10;
      animation: appear 1.2s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.7) translateY(40px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .emoji {
      font-size: 70px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    h1 {
      font-size: clamp(42px, 9vw, 75px);
      margin: 10px 0;
      background: linear-gradient(90deg, #fff, #ffd1f0, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255,255,255,0.4);
    }

    .name {
      font-size: clamp(30px, 7vw, 55px);
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,0.8);
      margin-bottom: 20px;
    }

    .message {
      font-size: clamp(16px, 4vw, 21px);
      line-height: 1.7;
      color: #fff;
      margin: 15px auto 25px;
      max-width: 550px;
    }

    .cake {
      font-size: 75px;
      margin: 10px;
      animation: cakeGlow 2s infinite alternate;
    }

    @keyframes cakeGlow {
      from {
        filter: drop-shadow(0 0 5px #fff);
      }
      to {
        filter: drop-shadow(0 0 25px #ffd700);
      }
    }

    button {
      border: none;
      outline: none;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: #4b0082;
      background: white;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(255,255,255,0.8);
    }

    /* Balloons */
    .balloon {
      position: absolute;
      width: 55px;
      height: 70px;
      border-radius: 50%;
      animation: float 5s ease-in-out infinite;
      z-index: 2;
    }

    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 90px;
      background: rgba(255,255,255,0.6);
      top: 68px;
      left: 50%;
    }

    .b1 {
      background: #ff4d6d;
      left: 8%;
      top: 15%;
    }

    .b2 {
      background: #00e5ff;
      right: 8%;
      top: 20%;
      animation-delay: 1s;
    }

    .b3 {
      background: #ffd700;
      left: 15%;
      bottom: 10%;
      animation-delay: 2s;
    }

    .b4 {
      background: #9b5de5;
      right: 15%;
      bottom: 12%;
      animation-delay: 1.5s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(-4deg);
      }
      50% {
        transform: translateY(-30px) rotate(4deg);
      }
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      z-index: 20;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .container {
        padding: 30px 18px;
        border-radius: 24px;
      }

      .emoji {
        font-size: 55px;
      }

      .cake {
        font-size: 60px;
      }

      .balloon {
        width: 38px;
        height: 50px;
      }

      .balloon::after {
        height: 60px;
        top: 48px;
      }

      .b1 {
        left: 3%;
      }

      .b2 {
        right: 3%;
      }

      .b3 {
        left: 5%;
      }

      .b4 {
        right: 5%;
      }
    }
  </style>
</head>

<body>

  <!-- Balloons -->
  <div class="balloon b1"></div>
  <div class="balloon b2"></div>
  <div class="balloon b3"></div>
  <div class="balloon b4"></div>

  <!-- Main Card -->
  <div class="container">

    <div class="emoji">🎉</div>

    <h1>Happy Birthday!</h1>

    <!-- Change the name here -->
    <div class="name">Dear Friend ❤️</div>

    <div class="cake">🎂</div>

    <p class="message">
      Wishing you a day filled with happiness, laughter,
      love and unforgettable memories! ✨
      <br><br>
      May all your dreams come true and may this new year
      of your life be even more amazing than the last. 💖
    </p>

    <button onclick="celebrate()">
      🎊 Celebrate Again
    </button>

  </div>

  <script>
    function createConfetti() {

      const colors = [
        "#ff4d6d",
        "#ffd700",
        "#00e5ff",
        "#9b5de5",
        "#00ff88",
        "#ffffff",
        "#ff8fab"
      ];

      for (let i = 0; i < 120; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";

        confetti.style.background =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.width =
          Math.random() * 8 + 5 + "px";

        confetti.style.height =
          Math.random() * 12 + 5 + "px";

        confetti.style.animationDuration =
          Math.random() * 3 + 2 + "s";

        confetti.style.animationDelay =
          Math.random() * 0.8 + "s";

        confetti.style.transform =
          `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 5500);
      }
    }

    function celebrate() {
      createConfetti();
    }

    // Start celebration automatically
    window.onload = () => {
      createConfetti();
    };
  </script>

</body>
</html>
